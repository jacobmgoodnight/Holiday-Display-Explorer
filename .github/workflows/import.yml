name: Fetch authorized display feeds
on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: display-import
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types scripts/fetch-feeds.ts
      - uses: actions/upload-artifact@v4
        with:
          name: display-import-review
          path: import-output/
          retention-days: 7
      - name: Save the review snapshot
        run: |
          cp import-output/candidate.json public/data/source-candidates.json
          cp import-output/report.json public/data/import-report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/source-candidates.json public/data/import-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh source discoveries for review"
            git push
          fi
  publish-review-snapshot:
    needs: fetch
    uses: ./.github/workflows/deploy.yml
